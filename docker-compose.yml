# NEON STACK 전체 스택 (프론트 + 배틀 백엔드)
#   docker compose up -d --build
#
# 외부 노출:
#   frontend :3000  (nginx — SPA 서빙 + /api·/ws를 gateway로 프록시)
#   gateway  :8000  (Go 게이트웨이 — REST + WebSocket)
# 내부망 전용: referee(:8081), postgres(:5432)
#
# 개발(네이티브) 실행은 .freebuff/run.md 참고 — vite dev 서버는 /api·/ws를
# localhost:8000으로 프록시한다.
services:
  frontend:
    build: .
    ports:
      - '3000:80'
    depends_on:
      - gateway

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neon
      POSTGRES_PASSWORD: neon
      POSTGRES_DB: neon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neon -d neon']
      interval: 3s
      timeout: 3s
      retries: 10

  referee:
    build: ./backend/rust
    environment:
      PORT: '8081'

  gateway:
    build: ./backend/go
    ports:
      - '8000:8000'
    environment:
      PORT: '8000'
      DATABASE_URL: postgres://neon:neon@postgres:5432/neon
      REFEREE_URL: http://referee:8081
    depends_on:
      postgres:
        condition: service_healthy
      referee:
        condition: service_started

volumes:
  pgdata:
